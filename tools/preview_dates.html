<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIFE QUEST 미리보기</title>
<style>html,body{height:100%}body{margin:0;background:#120d08;color:#f0e6d0;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;display:flex;flex-direction:column;align-items:center;padding:0 16px;box-sizing:border-box}
p{font-size:12.5px;color:#a99a76;margin:8px 0 4px;text-align:center;line-height:1.5}.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 6px;max-width:430px}
button{font-size:13px;padding:7px 10px;border-radius:6px;border:1px solid #c9a24d;background:#2a2016;color:#f0e6d0;cursor:pointer}#f{flex:1;width:100%;max-width:430px;min-height:0;margin-bottom:8px}iframe{width:100%;height:100%;border:1px solid #c9a24d;border-radius:8px;background:#000}</style></head><body>
<p>날짜를 골라 처음부터 시작해요. 고르면 이 미리보기의 저장 기록이 지워져요(실제 앱 기록과는 별개예요).</p>
<div class="row"><button data-d="0718">7/18</button><button data-d="0721">7/21</button><button data-d="0722">7/22 생일</button><button data-d="0723">7/23</button><button data-d="1224">12/24</button><button data-d="0314">3/14</button><button data-d="0328">3/28 벚꽃</button><button data-d="0410">4/10</button><button data-d="0505">5/5</button><button data-d="">오늘 날짜(기록 유지)</button><button id="keep">현재 기록으로 열기</button></div>
<div id="f"></div>
<script>
function start(d,clear){if(clear){try{localStorage.clear();sessionStorage.clear();}catch(e){}}
var f=document.getElementById('f');f.innerHTML='';var i=document.createElement('iframe');i.title='LIFE QUEST';i.src='app/index.html?t='+Date.now()+(d?'#d'+d:'');f.appendChild(i);}
document.querySelectorAll('button[data-d]').forEach(function(b){b.onclick=function(){start(b.dataset.d,!!b.dataset.d);};});
document.getElementById('keep').onclick=function(){start('',false);};
start('',false);
</script></body></html>
