<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>LIFE QUEST 미리보기</title>
<!-- 폰에서 날짜·시간을 골라 앱을 미리 눌러 보는 페이지.
     실제 앱 파일(../index.html)을 그대로 불러와서 날짜만 가짜로 바꿔요.
     저장은 미리보기 전용 칸(lqpv_ 로 시작)에만 해서 실제 앱 기록과 섞이지 않아요. -->
<style>
:root{--bg:#120d08;--ink:#f0e6d0;--sub:#a99a76;--gold:#c9a24d;--btn:#2a2016;--on:#5a3f17}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);box-sizing:border-box}
.wrap{max-width:430px;margin:0 auto}
h1{font-size:19px;margin:0 0 4px;text-align:center;color:#f6e3a8}
p{font-size:13px;color:var(--sub);line-height:1.6;margin:6px 0 14px;text-align:center}
h2{font-size:14px;margin:18px 0 8px;color:#e8d7a8}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:14px;padding:9px 11px;border-radius:8px;border:1px solid var(--gold);background:var(--btn);color:var(--ink);cursor:pointer}
button.on{background:var(--on);box-shadow:0 0 0 2px #f6e3a8 inset}
#go{width:100%;margin-top:22px;padding:13px;font-size:16px;font-weight:700;background:linear-gradient(#d9b35c,#b48a35);color:#2a1a08}
#reset{width:100%;margin-top:10px;background:transparent;color:var(--sub);border-color:#5a4a2a}
.note{font-size:12px;color:var(--sub);margin-top:16px;line-height:1.6}
</style></head><body><div class="wrap">
<h1>🔎 LIFE QUEST 미리보기</h1>
<p>날짜와 시간을 고르고 「미리보기 시작」을 눌러요.<br>여기서 누른 것은 <b>실제 앱 기록과 섞이지 않아요.</b></p>

<h2>날짜</h2>
<div class="row" id="days">
  <button data-d="">오늘</button>
  <button data-d="07-18">7/18 생일 주간</button><button data-d="07-21">7/21 생일 전날</button><button data-d="07-22">7/22 생일</button><button data-d="07-23">7/23</button>
  <button data-d="10-24">10/24 할로윈 주간</button><button data-d="10-27">10/27</button><button data-d="10-31">10/31 할로윈</button>
  <button data-d="11-07">11/7 입동</button><button data-d="12-20">12/20 크리스마스 주간</button><button data-d="12-22">12/22 동지</button><button data-d="12-24">12/24 이브</button><button data-d="12-25">12/25 크리스마스</button>
</div>

<h2>시간</h2>
<div class="row" id="hours">
  <button data-h="">지금</button><button data-h="8">아침 8시</button><button data-h="10">오전 10시</button><button data-h="13">점심 1시</button><button data-h="15">오후 3시</button><button data-h="19">저녁 7시</button><button data-h="23">밤 11시</button>
</div>

<button id="go">▶ 미리보기 시작</button>
<button id="reset">미리보기 기록 지우기 (처음 상태로)</button>
<div class="note">· 미리보기 안에서는 화면 맨 위 가운데 「🔎 미리보기」를 누르면 이 화면으로 돌아와요.<br>· 미리보기 기록은 이 브라우저에만 남아요. 「기록 지우기」를 누르면 새로 시작해요.<br>· 홈 화면에 설치한 앱에는 아무 영향이 없어요.</div>
</div>
<script>
(function(){
  var sel={d:'',h:''};
  function pick(box,key,attr){ var bs=document.querySelectorAll('#'+box+' button'); bs.forEach(function(b){ b.onclick=function(){ bs.forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on'); sel[key]=b.getAttribute(attr); }; }); bs[0].classList.add('on'); }
  pick('days','d','data-d'); pick('hours','h','data-h');
  function wipe(){ try{ for(var i=localStorage.length-1;i>=0;i--){ var k=localStorage.key(i); if(k&&k.indexOf('lqpv_')===0) localStorage.removeItem(k); } }catch(e){} }
  document.getElementById('reset').onclick=function(){ wipe(); this.textContent='✓ 지웠어요. 처음 상태로 시작해요'; };
  function kstParts(){ var k=new Date(Date.now()+9*36e5); return {y:k.getUTCFullYear(),md:('0'+(k.getUTCMonth()+1)).slice(-2)+'-'+('0'+k.getUTCDate()).slice(-2),h:k.getUTCHours(),mi:k.getUTCMinutes()}; }
  function mock(T,label){ return '<script>(function(){'
    +'var P="lqpv_",SP=Storage.prototype,g=SP.getItem,s=SP.setItem,r=SP.removeItem;'
    +'SP.getItem=function(k){return g.call(this,P+k)};SP.setItem=function(k,v){return s.call(this,P+k,v)};SP.removeItem=function(k){return r.call(this,P+k)};'
    +(T?'var R=Date,T='+T+',s0=R.now();class D extends R{constructor(...a){if(a.length)super(...a);else super(T+(R.now()-s0));}static now(){return T+(R.now()-s0);}}window.Date=D;':'')
    +'document.addEventListener("DOMContentLoaded",function(){var b=document.createElement("button");b.textContent="🔎 미리보기 · '+label+'";'
    +'b.style.cssText="position:fixed;top:calc(env(safe-area-inset-top,0px) + 2px);left:50%;transform:translateX(-50%);z-index:2147483647;font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid #c9a24d;background:rgba(42,32,22,.85);color:#f6e3a8;opacity:.85";'
    +'b.onclick=function(){location.reload()};document.body.appendChild(b);});'
    +'})();<\/script>'; }
  document.getElementById('go').onclick=function(){
    var btn=this; btn.textContent='불러오는 중…';
    var now=kstParts(), md=sel.d||now.md, hh=sel.h===''?now.h:+sel.h, mi=sel.h===''?now.mi:0;
    var T=(sel.d||sel.h!=='')?Date.parse(now.y+'-'+md+'T'+('0'+hh).slice(-2)+':'+('0'+mi).slice(-2)+':00+09:00'):0;
    var label=(sel.d?md.replace('-','/').replace(/^0/,''):'오늘')+(sel.h!==''?' '+hh+'시':'');
    fetch('../index.html',{cache:'no-store'}).then(function(r){ return r.text(); }).then(function(html){
      var base=new URL('../',location.href).href;
      html=html.replace(/navigator\.serviceWorker\.register\([^)]*\)/g,'Promise.resolve()')
               .replace(/<head>/i,'<head><base href="'+base+'">'+mock(T,label));
      document.open(); document.write(html); document.close();
    }).catch(function(){ btn.textContent='불러오지 못했어요. 다시 눌러 주세요'; });
  };
})();
</script>
</body></html>
